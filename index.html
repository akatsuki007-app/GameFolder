<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D City - 3D Thar Model</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: 'Roboto', sans-serif;
            user-select: none;
            touch-action: none;
        }

        #ui {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #333;
            z-index: 10;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            padding: 10px 15px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            pointer-events: none;
            border-right: 4px solid #ff5722;
            text-align: right;
        }

        h2 { margin: 0 0 4px 0; color: #222; font-size: 15px; }
        p { margin: 2px 0; font-size: 11px; color: #555; }

        #minimap-container {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 110px;
            height: 110px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #fff;
            border-radius: 12px;
            z-index: 15;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        #minimap-canvas {
            width: 100%;
            height: 100%;
        }

        #action-btn {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, #ff5722, #e64a19);
            border: 2px solid #fff;
            color: #fff;
            border-radius: 50%;
            font-size: 11px;
            font-weight: bold;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 6px 20px rgba(255, 87, 34, 0.4);
            outline: none;
            text-align: center;
            line-height: 1.2;
        }

        #action-btn:active {
            transform: translateY(-50%) scale(0.92);
        }

        #action-btn span {
            font-size: 20px;
            margin-bottom: 2px;
        }

        .controls-container {
            position: absolute;
            bottom: 25px;
            left: 25px;
            display: grid;
            grid-template-columns: 50px 50px 50px;
            grid-template-rows: 50px 50px;
            gap: 8px;
            z-index: 10;
        }

        .action-container {
            position: absolute;
            bottom: 25px;
            right: 25px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            z-index: 10;
        }

        #speedometer {
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            display: none;
            text-align: center;
            backdrop-filter: blur(4px);
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.85);
            border: 1.5px solid #ccc;
            color: #333;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            width: 50px;
            height: 50px;
        }

        .control-btn:active, .control-btn.active {
            background: #ff5722;
            color: #fff;
            border-color: #e64a19;
        }

        #btn-run {
            position: absolute;
            bottom: 25px;
            left: 195px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            border: 1.5px solid #fff;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 10;
            outline: none;
            transition: background 0.2s;
        }

        #btn-run.active {
            background: linear-gradient(135deg, #4caf50, #388e3c);
            border-color: #fff;
            box-shadow: 0 0 12px rgba(76, 175, 80, 0.6);
        }

        #btn-gear {
            background: linear-gradient(135deg, #1976d2, #0d47a1);
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            border: 2px solid #fff;
            display: none;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            box-shadow: 0 6px 15px rgba(25, 118, 210, 0.4);
            pointer-events: auto;
            z-index: 30;
        }

        #btn-gear:active {
            transform: scale(0.92);
        }

        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        .hint {
            position: absolute;
            bottom: 145px;
            right: 25px;
            color: #fff;
            font-size: 10px;
            z-index: 10;
            pointer-events: none;
            text-align: right;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 10px;
            border-radius: 6px;
            backdrop-filter: blur(4px);
        }

        @media (max-width: 600px) {
            .control-btn { width: 44px; height: 44px; font-size: 16px; }
            .controls-container { grid-template-columns: 44px 44px 44px; grid-template-rows: 44px 44px; gap: 6px; bottom: 20px; left: 20px; }
            #btn-run { left: 170px; bottom: 20px; width: 44px; height: 44px; font-size: 11px; }
            .action-container { bottom: 20px; right: 20px; }
            .hint { bottom: 135px; right: 20px; font-size: 9px; }
        }
    </style>
</head>
<body>

    <div id="minimap-container">
        <canvas id="minimap-canvas" width="110" height="110"></canvas>
    </div>

    <div id="ui">
        <h2 id="level-title">LEVEL 01</h2>
        <p id="mission-text">Target: Collect Gold Coin</p>
        <p id="score-text">Score: 0</p>
        <p id="mode-text" style="color: #2e7d32; font-weight: bold;">Mode: Walking</p>
    </div>

    <button id="action-btn">
        <span id="action-icon">🚙</span>
        <span id="action-text">ENTER</span>
    </button>

    <div class="controls-container">
        <button class="control-btn" id="btn-up">▲</button>
        <button class="control-btn" id="btn-left">◀</button>
        <button class="control-btn" id="btn-down">▼</button>
        <button class="control-btn" id="btn-right">▶</button>
    </div>

    <button id="btn-run">RUN</button>

    <div class="hint">Mahindra Thar ke paas button dabayein</div>

    <div class="action-container" id="action-container">
        <div id="speedometer">🚗 0 km/h | Gear 1</div>
        <button class="control-btn" id="btn-gear">GEAR 1</button>
        <button class="control-btn" id="btn-jump" title="Jump">⬆️</button>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- GLTFLoader for 3D Models (.glb / .gltf) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        let scene, camera, renderer, player;
        let leftArm, rightArm, leftLeg, rightLeg;
        let obstacles = [];
        let target;
        let cars = [];
        let activeCar = null;
        let isDriving = false;

        let score = 0;
        let level = 1;
        let keys = { forward: false, backward: false, left: false, right: false, jump: false };
        let isRunning = false;
        let walkSpeed = 0.10; 
        let runSpeed = 0.22;
        
        let currentGear = 1;
        let currentCarSpeed = 0;
        const gearMaxSpeeds = [0, 50, 100, 150];

        let isJumping = false;
        let jumpVelocity = 0;
        const gravity = 0.015;
        const jumpForce = 0.22;

        let cameraAngleX = 0; 
        let cameraAngleY = 0.35; 
        let cameraDistance = 6.5; 
        let carCameraDistance = 9.5; 
        let isUserDragging = false;

        let miniMapCtx, miniMapCanvas;
        let buildingMaterials = [];
        let grassMaterial, footpathMaterial, roadMaterial, zebraMaterial;
        let walkCycle = 0;

        function initGame() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.008);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = false;
            document.body.appendChild(renderer.domElement);

            miniMapCanvas = document.getElementById('minimap-canvas');
            miniMapCtx = miniMapCanvas.getContext('2d');

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.9);
            sunLight.position.set(40, 60, 40);
            scene.add(sunLight);

            createDiverseBuildingMaterials();
            createEnvironmentMaterials();

            const floorGeo = new THREE.PlaneGeometry(160, 160);
            const floor = new THREE.Mesh(floorGeo, grassMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -0.01;
            scene.add(floor);

            createUrbanRoadSystem();
            createCityAndObjects();
            
            createPlayerCharacter();
            createTarget();

            window.addEventListener('keydown', (e) => handleKeys(e, true));
            window.addEventListener('keyup', (e) => handleKeys(e, false));
            setupOnScreenButtons();
            setupFreeLook();
            window.addEventListener('resize', onWindowResize);

            document.getElementById('action-btn').addEventListener('click', toggleCarEntry);
            
            const gearBtn = document.getElementById('btn-gear');
            gearBtn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                changeGear();
            });

            animate();
        }

        function createPlayerCharacter() {
            const playerGroup = new THREE.Group();

            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.6 });
            const shirtMat = new THREE.MeshStandardMaterial({ color: 0x1976d2, roughness: 0.4 });
            const pantMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.7 });

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.32, 0.32), skinMat);
            head.position.y = 1.34;
            playerGroup.add(head);

            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.58, 0.24), shirtMat);
            torso.position.y = 0.89;
            playerGroup.add(torso);

            const armGeo = new THREE.BoxGeometry(0.14, 0.52, 0.14);
            armGeo.translate(0, -0.21, 0);

            const leftArmGroup = new THREE.Group();
            leftArmGroup.position.set(-0.33, 1.12, 0);
            leftArm = new THREE.Mesh(armGeo, shirtMat);
            leftArmGroup.add(leftArm);
            playerGroup.add(leftArmGroup);

            const rightArmGroup = new THREE.Group();
            rightArmGroup.position.set(0.33, 1.12, 0);
            rightArm = new THREE.Mesh(armGeo, shirtMat);
            rightArmGroup.add(rightArm);
            playerGroup.add(rightArmGroup);

            const legGeo = new THREE.BoxGeometry(0.18, 0.58, 0.18);
            legGeo.translate(0, -0.25, 0);

            const leftLegGroup = new THREE.Group();
            leftLegGroup.position.set(-0.12, 0.58, 0);
            leftLeg = new THREE.Mesh(legGeo, pantMat);
            leftLegGroup.add(leftLeg);
            playerGroup.add(leftLegGroup);

            const rightLegGroup = new THREE.Group();
            rightLegGroup.position.set(0.12, 0.58, 0);
            rightLeg = new THREE.Mesh(legGeo, pantMat);
            rightLegGroup.add(rightLeg);
            playerGroup.add(rightLegGroup);

            player = playerGroup;
            player.userData = { 
                leftArm: leftArmGroup, 
                rightArm: rightArmGroup, 
                leftLeg: leftLegGroup, 
                rightLeg: rightLegGroup,
                leftArmMesh: leftArm,
                rightArmMesh: rightArm
            };
            
            player.position.set(0, 0, 25); 
            scene.add(player);
        }

        function createDiverseBuildingMaterials() {
            const colorPalettes = [
                { bg: '#708090', trim: '#2f4f4f', win: '#add8e6' }, 
                { bg: '#8b4513', trim: '#5c3317', win: '#ffffe0' }, 
                { bg: '#4682b4', trim: '#104e8b', win: '#e0ffff' }, 
                { bg: '#cd853f', trim: '#8b5a2b', win: '#fffacd' }, 
                { bg: '#556b2f', trim: '#2e4016', win: '#f0fff0' }  
            ];

            colorPalettes.forEach(palette => {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = palette.bg;
                ctx.fillRect(0, 0, 512, 512);

                ctx.fillStyle = palette.trim;
                for (let y = 0; y < 512; y += 24) {
                    ctx.fillRect(0, y, 512, 3);
                }

                ctx.fillStyle = palette.win;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;

                for (let x = 40; x < 512; x += 90) {
                    for (let y = 30; y < 512; y += 70) {
                        ctx.fillRect(x, y, 60, 45);
                        ctx.strokeRect(x, y, 60, 45);
                        ctx.fillStyle = palette.trim;
                        ctx.fillRect(x + 28, y, 4, 45);
                        ctx.fillStyle = palette.win;
                    }
                }

                const texture = new THREE.CanvasTexture(canvas);
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                texture.repeat.set(1, 4);

                buildingMaterials.push(new THREE.MeshStandardMaterial({ map: texture, roughness: 0.7 }));
            });
        }

        function createEnvironmentMaterials() {
            const grassCanvas = document.createElement('canvas');
            grassCanvas.width = 256;
            grassCanvas.height = 256;
            let ctx = grassCanvas.getContext('2d');
            ctx.fillStyle = '#4caf50';
            ctx.fillRect(0, 0, 256, 256);
            ctx.fillStyle = '#388e3c';
            for(let i=0; i<400; i++) {
                let gx = Math.random() * 256;
                let gy = Math.random() * 256;
                ctx.fillRect(gx, gy, 3, 3);
            }
            const grassTex = new THREE.CanvasTexture(grassCanvas);
            grassTex.wrapS = THREE.RepeatWrapping;
            grassTex.wrapT = THREE.RepeatWrapping;
            grassTex.repeat.set(16, 16);
            grassMaterial = new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.8 });

            const footCanvas = document.createElement('canvas');
            footCanvas.width = 256;
            footCanvas.height = 256;
            ctx = footCanvas.getContext('2d');
            ctx.fillStyle = '#b0bec5';
            ctx.fillRect(0, 0, 256, 256);
            ctx.strokeStyle = '#78909c';
            ctx.lineWidth = 4;
            ctx.strokeRect(0, 0, 256, 256);
            ctx.beginPath();
            ctx.moveTo(0, 128); ctx.lineTo(256, 128);
            ctx.moveTo(128, 0); ctx.lineTo(128, 256);
            ctx.stroke();
            const footTex = new THREE.CanvasTexture(footCanvas);
            footTex.wrapS = THREE.RepeatWrapping;
            footTex.wrapT = THREE.RepeatWrapping;
            footTex.repeat.set(2, 2);
            footpathMaterial = new THREE.MeshStandardMaterial({ map: footTex, roughness: 0.7 });

            const roadCanvas = document.createElement('canvas');
            roadCanvas.width = 128;
            roadCanvas.height = 128;
            ctx = roadCanvas.getContext('2d');
            ctx.fillStyle = '#333338';
            ctx.fillRect(0, 0, 128, 128);
            
            ctx.fillStyle = '#ffffff';
            for(let i = 0; i < 128; i += 32) {
                ctx.fillRect(62, i, 4, 16);
            }

            const roadTex = new THREE.CanvasTexture(roadCanvas);
            roadTex.wrapS = THREE.RepeatWrapping;
            roadTex.wrapT = THREE.RepeatWrapping;
            roadTex.repeat.set(1, 12);

            roadMaterial = new THREE.MeshStandardMaterial({
                map: roadTex,
                roughness: 0.85
            });
            
            const zebraCanvas = document.createElement('canvas');
            zebraCanvas.width = 128;
            zebraCanvas.height = 128;
            let zCtx = zebraCanvas.getContext('2d');
            zCtx.fillStyle = '#333338'; 
            zCtx.fillRect(0, 0, 128, 128);
            
            zCtx.fillStyle = '#ffffff';
            for(let i = 10; i < 128; i += 24) {
                zCtx.fillRect(i, 20, 12, 88);
            }
            const zebraTex = new THREE.CanvasTexture(zebraCanvas);
            zebraTex.wrapS = THREE.RepeatWrapping;
            zebraTex.wrapT = THREE.RepeatWrapping;
            
            zebraMaterial = new THREE.MeshStandardMaterial({
                map: zebraTex,
                roughness: 0.85
            });
        }

        function createUrbanRoadSystem() {
            const vRoad1 = new THREE.Mesh(new THREE.PlaneGeometry(12, 140), roadMaterial);
            vRoad1.rotation.x = -Math.PI / 2;
            vRoad1.position.set(-18, 0.01, 0);
            scene.add(vRoad1);

            const vRoad2 = new THREE.Mesh(new THREE.PlaneGeometry(12, 140), roadMaterial);
            vRoad2.rotation.x = -Math.PI / 2;
            vRoad2.position.set(18, 0.01, 0);
            scene.add(vRoad2);

            const roadCanvasH = document.createElement('canvas');
            roadCanvasH.width = 128;
            roadCanvasH.height = 128;
            let ctx = roadCanvasH.getContext('2d');
            ctx.fillStyle = '#333338';
            ctx.fillRect(0, 0, 128, 128);
            ctx.fillStyle = '#ffffff';
            for(let i = 0; i < 128; i += 32) {
                ctx.fillRect(i, 62, 16, 4);
            }
            const roadTexH = new THREE.CanvasTexture(roadCanvasH);
            roadTexH.wrapS = THREE.RepeatWrapping;
            roadTexH.wrapT = THREE.RepeatWrapping;
            roadTexH.repeat.set(12, 1);
            const roadMaterialH = new THREE.MeshStandardMaterial({ map: roadTexH, roughness: 0.85 });

            const hRoad1 = new THREE.Mesh(new THREE.PlaneGeometry(140, 12), roadMaterialH);
            hRoad1.rotation.x = -Math.PI / 2;
            hRoad1.position.set(0, 0.015, -18);
            scene.add(hRoad1);

            const hRoad2 = new THREE.Mesh(new THREE.PlaneGeometry(140, 12), roadMaterialH);
            hRoad2.rotation.x = -Math.PI / 2;
            hRoad2.position.set(0, 0.015, 18);
            scene.add(hRoad2);

            const zebraGeo = new THREE.PlaneGeometry(12, 3);

            const crossings = [
                { x: -18, z: -11, rot: 0 },
                { x: -18, z: 11, rot: 0 },
                { x: 18, z: -11, rot: 0 },
                { x: 18, z: 11, rot: 0 },
                { x: -11, z: -18, rot: Math.PI / 2 },
                { x: 11, z: -18, rot: Math.PI / 2 },
                { x: -11, z: 18, rot: Math.PI / 2 },
                { x: 11, z: 18, rot: Math.PI / 2 }
            ];

            crossings.forEach(c => {
                const zebra = new THREE.Mesh(zebraGeo, zebraMaterial);
                zebra.rotation.x = -Math.PI / 2;
                zebra.rotation.z = c.rot;
                zebra.position.set(c.x, 0.02, c.z);
                scene.add(zebra);
            });

            createStreetLights();
        }

        function createStreetLights() {
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.5, metalness: 0.8 });
            const lampMat = new THREE.MeshBasicMaterial({ color: 0xffffee });

            function addLightPole(x, z, rotationY) {
                const poleGroup = new THREE.Group();

                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 4.5, 8), poleMat);
                pole.position.y = 2.25;
                poleGroup.add(pole);

                const arm = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 1.2), poleMat);
                arm.position.set(0, 4.4, 0.5);
                poleGroup.add(arm);

                const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), lampMat);
                bulb.position.set(0, 4.25, 1.0);
                poleGroup.add(bulb);

                poleGroup.position.set(x, 0, z);
                poleGroup.rotation.y = rotationY;
                scene.add(poleGroup);
            }

            for (let i = -50; i <= 50; i += 25) {
                if (Math.abs(i) < 10) continue;
                addLightPole(-25, i, 0);
                addLightPole(-11, i, Math.PI);
                addLightPole(11, i, 0);
                addLightPole(25, i, Math.PI);

                addLightPole(i, -25, Math.PI / 2);
                addLightPole(i, -11, -Math.PI / 2);
                addLightPole(i, 11, Math.PI / 2);
                addLightPole(i, 25, -Math.PI / 2);
            }
        }

        function createCityAndObjects() {
            const blockPositions = [
                [-36, -36], [0, -36], [36, -36],
                [-36, 0],   [0, 0],   [36, 0],
                [-36, 36],  [0, 36],  [36, 36]
            ];

            blockPositions.forEach((pos, index) => {
                const width = 14 + (index % 2) * 2; 
                const depth = 14 + (index % 3) * 2;
                const height = 9 + Math.random() * 12;

                let bx = pos[0];
                let bz = pos[1];

                const footWidth = width + 1.6;
                const footDepth = depth + 1.6;
                const footpathGeo = new THREE.BoxGeometry(footWidth, 0.25, footDepth);
                const footpath = new THREE.Mesh(footpathGeo, footpathMaterial);
                footpath.position.set(bx, 0.125, bz);
                scene.add(footpath);

                const grassWidth = footWidth + 2.0;
                const grassDepth = footDepth + 2.0;
                const grassBedGeo = new THREE.BoxGeometry(grassWidth, 0.1, grassDepth);
                const grassBed = new THREE.Mesh(grassBedGeo, grassMaterial);
                grassBed.position.set(bx, 0.05, bz);
                scene.add(grassBed);

                const houseGeo = new THREE.BoxGeometry(width, height, depth);
                const randomMaterial = buildingMaterials[index % buildingMaterials.length];
                const house = new THREE.Mesh(houseGeo, randomMaterial);
                house.position.set(bx, height / 2, bz);
                
                house.userData = { width: grassWidth, depth: grassDepth }; 
                scene.add(house);
                obstacles.push(house);
            });

            createMahindraThar(18, -6);
            createMahindraThar(-18, 6);
        }

        // ==========================================
        // YAHAN 3D THAR LOAD HOTA HAI (GLTFLoader)
        // ==========================================
        function createMahindraThar(x, z) {
            const loader = new THREE.GLTFLoader();
            
            // ✅ Yahan error theek kar di gayi hai:
            const modelPath = 'thar_4x4.glb'; 

            loader.load(modelPath, function (gltf) {
                const tharGroup = gltf.scene;
                
                tharGroup.scale.set(1, 1, 1); 
                tharGroup.position.set(x, 0, z);
                
                tharGroup.userData = { width: 2.0, depth: 3.6 };
                
                scene.add(tharGroup);
                obstacles.push(tharGroup);
                cars.push(tharGroup);

            }, undefined, function (error) {
                console.warn('3D Thar model load nahi ho paya, path check karein:', error);
            });
        }

        function createTarget() {
            const targetGeo = new THREE.CylinderGeometry(0.7, 0.7, 0.2, 32);
            const targetMat = new THREE.MeshStandardMaterial({ 
                color: 0xffd700, 
                roughness: 0.3,
                metalness: 0.2
            }); 
            target = new THREE.Mesh(targetGeo, targetMat);
            target.rotation.x = Math.PI / 2;
            
            respawnTarget();
            scene.add(target);
        }

        function respawnTarget() {
            let validPosition = false;
            let rx, rz;
            let safetyCounter = 0;

            while (!validPosition && safetyCounter < 100) {
                safetyCounter++;
                rx = (Math.random() - 0.5) * 60;
                rz = (Math.random() - 0.5) * 60;
                
                validPosition = true;
                const safeDistanceMargin = 2.5;

                for (let obj of obstacles) {
                    let ox = obj.position.x;
                    let oz = obj.position.z;
                    let ow = (obj.userData.width / 2) + safeDistanceMargin;
                    let od = (obj.userData.depth / 2) + safeDistanceMargin;

                    if (rx > ox - ow && rx < ox + ow && rz > oz - od && rz < oz + od) {
                        validPosition = false;
                        break;
                    }
                }
            }

            target.position.set(rx, 1, rz);
        }

        function drawMiniMap() {
            if (!miniMapCtx) return;
            
            miniMapCtx.clearRect(0, 0, 110, 110);
            miniMapCtx.fillStyle = '#222';
            miniMapCtx.fillRect(0, 0, 110, 110);

            let mapScale = 0.9; 
            let centerX = 55;
            let centerY = 55;

            let trackingObj = isDriving ? activeCar : player;
            let px = trackingObj.position.x;
            let pz = trackingObj.position.z;

            miniMapCtx.fillStyle = '#888';
            obstacles.forEach(obj => {
                let bx = centerX + (obj.position.x - px) * mapScale;
                let bz = centerY + (obj.position.z - pz) * mapScale;
                let bw = (obj.userData.width || 2) * mapScale;
                let bd = (obj.userData.depth || 2) * mapScale;

                if (bx > -20 && bx < 130 && bz > -20 && bz < 130) {
                    miniMapCtx.fillRect(bx - bw/2, bz - bd/2, bw, bd);
                }
            });

            let tx = centerX + (target.position.x - px) * mapScale;
            let tz = centerY + (target.position.z - pz) * mapScale;
            miniMapCtx.fillStyle = '#ffd700';
            miniMapCtx.beginPath();
            miniMapCtx.arc(tx, tz, 4, 0, Math.PI * 2);
            miniMapCtx.fill();

            miniMapCtx.save();
            miniMapCtx.translate(centerX, centerY);
            miniMapCtx.rotate(-trackingObj.rotation.y + Math.PI); 

            miniMapCtx.fillStyle = '#ff3333';
            miniMapCtx.beginPath();
            miniMapCtx.moveTo(0, -8); 
            miniMapCtx.lineTo(-6, 6);  
            miniMapCtx.lineTo(0, 3);   
            miniMapCtx.lineTo(6, 6);   
            miniMapCtx.closePath();
            miniMapCtx.fill();
            miniMapCtx.strokeStyle = '#fff';
            miniMapCtx.lineWidth = 1;
            miniMapCtx.stroke();
            miniMapCtx.restore();
        }

        function toggleRunMode() {
            isRunning = !isRunning;
            const runBtn = document.getElementById('btn-run');
            if (runBtn) {
                if (isRunning) {
                    runBtn.classList.add('active');
                } else {
                    runBtn.classList.remove('active');
                }
            }
        }

        function handleKeys(e, isDown) {
            if (e.code === 'KeyE' && isDown) {
                toggleCarEntry();
                return;
            }
            if (e.code === 'Space' && isDown) {
                triggerJump();
                return;
            }
            if ((e.code === 'ShiftLeft' || e.code === 'ShiftRight') && isDown) {
                toggleRunMode();
                return;
            }
            if (e.code === 'KeyG' && isDown && isDriving) {
                changeGear();
                return;
            }

            switch(e.code) {
                case 'KeyW':
                case 'ArrowUp':
                    keys.forward = isDown; break;
                case 'KeyS':
                case 'ArrowDown':
                    keys.backward = isDown; break;
                case 'ArrowLeft':
                case 'KeyA':
                    keys.left = isDown; break;
                case 'ArrowRight':
                case 'KeyD':
                    keys.right = isDown; break;
            }
        }

        function triggerJump() {
            if (!isDriving && !isJumping) {
                isJumping = true;
                jumpVelocity = jumpForce;
            }
        }

        function changeGear() {
            if (!isDriving) return;
            currentGear++;
            if (currentGear > 3) {
                currentGear = 1;
            }
            document.getElementById('btn-gear').innerText = `GEAR ${currentGear}`;
        }

        function toggleCarEntry() {
            const actionBtn = document.getElementById('action-btn');
            const jumpBtn = document.getElementById('btn-jump');
            const gearBtn = document.getElementById('btn-gear');
            const runBtn = document.getElementById('btn-run');
            const speedometer = document.getElementById('speedometer');

            if (!isDriving) {
                for (let car of cars) {
                    if (player.position.distanceTo(car.position) < 3.2) {
                        activeCar = car;
                        isDriving = true;
                        currentGear = 1;
                        document.getElementById('btn-gear').innerText = `GEAR 1`;
                        scene.remove(player); 
                        document.getElementById('mode-text').innerText = "Mode: Driving Thar";
                        document.getElementById('mode-text').style.color = "#d32f2f";
                        
                        document.getElementById('action-icon').innerText = "🚶‍♂️";
                        document.getElementById('action-text').innerText = "EXIT";
                        actionBtn.style.background = "linear-gradient(135deg, #333, #111)";
                        
                        jumpBtn.style.display = 'none';
                        runBtn.style.display = 'none';
                        gearBtn.style.display = 'flex';
                        speedometer.style.display = 'block';

                        cameraAngleX = activeCar.rotation.y + Math.PI;
                        cameraAngleY = 0.35;
                        break;
                    }
                }
            } else {
                player.position.set(activeCar.position.x + 2.2, 0, activeCar.position.z);
                scene.add(player);
                isDriving = false;
                currentCarSpeed = 0;
                activeCar = null;
                document.getElementById('mode-text').innerText = "Mode: Walking";
                document.getElementById('mode-text').style.color = "#2e7d32";
                
                document.getElementById('action-icon').innerText = "🚙";
                document.getElementById('action-text').innerText = "ENTER";
                actionBtn.style.background = "linear-gradient(135deg, #ff5722, #e64a19)";
                actionBtn.style.display = 'none'; 
                
                jumpBtn.style.display = 'flex';
                runBtn.style.display = 'flex';
                gearBtn.style.display = 'none';
                speedometer.style.display = 'none';

                cameraAngleX = player.rotation.y + Math.PI;
                cameraAngleY = 0.35;
            }
        }

        function setupOnScreenButtons() {
            const bindButton = (id, keyName) => {
                const btn = document.getElementById(id);
                if(!btn) return;
                const pressEvent = (e) => { e.preventDefault(); keys[keyName] = true; btn.classList.add('active'); };
                const releaseEvent = (e) => { e.preventDefault(); keys[keyName] = false; btn.classList.remove('active'); };

                btn.addEventListener('mousedown', pressEvent);
                btn.addEventListener('mouseup', releaseEvent);
                btn.addEventListener('mouseleave', releaseEvent);
                btn.addEventListener('touchstart', pressEvent);
                btn.addEventListener('touchend', releaseEvent);
            };

            bindButton('btn-up', 'forward');
            bindButton('btn-down', 'backward');
            bindButton('btn-left', 'left');
            bindButton('btn-right', 'right');

            const runBtn = document.getElementById('btn-run');
            if(runBtn) {
                runBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    toggleRunMode();
                });
            }

            const jumpBtn = document.getElementById('btn-jump');
            if(jumpBtn) {
                const jumpPress = (e) => { e.preventDefault(); triggerJump(); jumpBtn.classList.add('active'); };
                const jumpRelease = (e) => { e.preventDefault(); jumpBtn.classList.remove('active'); };
                jumpBtn.addEventListener('mousedown', jumpPress);
                jumpBtn.addEventListener('mouseup', jumpRelease);
                jumpBtn.addEventListener('mouseleave', jumpRelease);
                jumpBtn.addEventListener('touchstart', jumpPress);
                jumpBtn.addEventListener('touchend', jumpRelease);
            }
        }

        function setupFreeLook() {
            let prevPos = { x: 0, y: 0 };

            window.addEventListener('mousedown', (e) => { 
                if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
                isUserDragging = true; 
                prevPos = { x: e.clientX, y: e.clientY }; 
            });
            window.addEventListener('mouseup', () => { isUserDragging = false; });
            window.addEventListener('mousemove', (e) => {
                if (!isUserDragging) return;
                let dx = e.clientX - prevPos.x;
                let dy = e.clientY - prevPos.y;
                cameraAngleX -= dx * 0.005;
                cameraAngleY = Math.max(0.1, Math.min(1.2, cameraAngleY - dy * 0.005));
                prevPos = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('touchstart', (e) => {
                if (e.target.tagName === 'BUTTON' || e.target.closest('button') || e.target.closest('#ui') || e.target.closest('#minimap-container')) return;
                isUserDragging = true;
                prevPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }, { passive: true });
            window.addEventListener('touchend', () => { isUserDragging = false; });
            window.addEventListener('touchmove', (e) => {
                if (!isUserDragging || e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
                let dx = e.touches[0].clientX - prevPos.x;
                let dy = e.touches[0].clientY - prevPos.y;
                cameraAngleX -= dx * 0.005;
                cameraAngleY = Math.max(0.1, Math.min(1.2, cameraAngleY - dy * 0.005));
                prevPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }, { passive: true });
        }

        function checkCollision(nextX, nextZ, currentObj) {
            let allObstacles = [...obstacles];
            
            if (currentObj === player) {
                allObstacles = allObstacles.concat(cars);
            }

            for (let obj of allObstacles) {
                if (obj === currentObj) continue;
                let ox = obj.position.x;
                let oz = obj.position.z;
                let ow = (obj.userData.width || 2) / 2;
                let od = (obj.userData.depth || 2) / 2;

                if (currentObj === player) {
                    let playerRadius = 0.3; 
                    if (nextX + playerRadius > ox - ow && nextX - playerRadius < ox + ow &&
                        nextZ + playerRadius > oz - od && nextZ - playerRadius < oz + od) {
                        return true;
                    }
                } else {
                    let carRadius = 1.95; 
                    let closestX = Math.max(ox - ow, Math.min(nextX, ox + ow));
                    let closestZ = Math.max(oz - od, Math.min(nextZ, oz + od));
                    let distX = nextX - closestX;
                    let distZ = nextZ - closestZ;
                    
                    if ((distX * distX + distZ * distZ) < (carRadius * carRadius)) {
                        return true;
                    }
                }
            }
            return false;
        }

        function updateGame() {
            let inputX = 0;
            let inputZ = 0;

            if (keys.forward) inputZ -= 1;
            if (keys.backward) inputZ += 1;
            if (keys.left) inputX -= 1;
            if (keys.right) inputX += 1;

            let currentDist = isDriving ? carCameraDistance : cameraDistance;
            let activeObj = isDriving ? activeCar : player;

            if (!isDriving) {
                if (inputX !== 0 || inputZ !== 0) {
                    let currentSpeed = isRunning ? runSpeed : walkSpeed;
                    let moveAngle = Math.atan2(inputX, inputZ) + cameraAngleX;
                    let nextX = player.position.x + Math.sin(moveAngle) * currentSpeed;
                    let nextZ = player.position.z + Math.cos(moveAngle) * currentSpeed;

                    if (!checkCollision(nextX, player.position.z, player)) player.position.x = nextX;
                    if (!checkCollision(player.position.x, nextZ, player)) player.position.z = nextZ;

                    player.rotation.y = moveAngle;

                    if (!isJumping) {
                        walkCycle += isRunning ? 0.4 : 0.15;
                        let swingAmp = isRunning ? 1.1 : 0.6;
                        player.userData.leftArm.rotation.x = Math.sin(walkCycle) * swingAmp;
                        player.userData.rightArm.rotation.x = -Math.sin(walkCycle) * swingAmp;
                        player.userData.leftLeg.rotation.x = -Math.sin(walkCycle) * swingAmp;
                        player.userData.rightLeg.rotation.x = Math.sin(walkCycle) * swingAmp;
                    }
                } else if (!isJumping) {
                    walkCycle = 0;
                    player.userData.leftArm.rotation.x = THREE.MathUtils.lerp(player.userData.leftArm.rotation.x, 0, 0.1);
                    player.userData.rightArm.rotation.x = THREE.MathUtils.lerp(player.userData.rightArm.rotation.x, 0, 0.1);
                    player.userData.leftLeg.rotation.x = THREE.MathUtils.lerp(player.userData.leftLeg.rotation.x, 0, 0.1);
                    player.userData.rightLeg.rotation.x = THREE.MathUtils.lerp(player.userData.rightLeg.rotation.x, 0, 0.1);
                }

                if (isJumping) {
                    player.position.y += jumpVelocity;
                    jumpVelocity -= gravity;

                    player.userData.leftArm.rotation.x = THREE.MathUtils.lerp(player.userData.leftArm.rotation.x, -Math.PI * 0.6, 0.2);
                    player.userData.rightArm.rotation.x = THREE.MathUtils.lerp(player.userData.rightArm.rotation.x, -Math.PI * 0.6, 0.2);
                    player.userData.leftLeg.rotation.x = THREE.MathUtils.lerp(player.userData.leftLeg.rotation.x, 0.3, 0.2);
                    player.userData.rightLeg.rotation.x = THREE.MathUtils.lerp(player.userData.rightLeg.rotation.x, 0.3, 0.2);

                    if (player.position.y <= 0) {
                        player.position.y = 0;
                        isJumping = false;
                        jumpVelocity = 0;
                    }
                }

                player.position.x = Math.max(-70, Math.min(70, player.position.x));
                player.position.z = Math.max(-70, Math.min(70, player.position.z));

                let nearCar = false;
                for (let car of cars) {
                    if (player.position.distanceTo(car.position) < 3.2) {
                        nearCar = true;
                        break;
                    }
                }
                document.getElementById('action-btn').style.display = nearCar ? 'flex' : 'none';

            } else {
                let targetMaxSpeed = gearMaxSpeeds[currentGear];
                
                if (inputX !== 0 || inputZ !== 0) {
                    currentCarSpeed = Math.min(targetMaxSpeed, currentCarSpeed + 3.0);
                } else {
                    currentCarSpeed = 0; 
                }

                if (currentCarSpeed > targetMaxSpeed) {
                    currentCarSpeed = targetMaxSpeed;
                }

                if (currentCarSpeed > 0) {
                    let moveAngle = Math.atan2(inputX, inputZ) + cameraAngleX;
                    let movementFactor = (currentCarSpeed / 150) * 0.45;
                    
                    let nextX = activeCar.position.x + Math.sin(moveAngle) * movementFactor;
                    let nextZ = activeCar.position.z + Math.cos(moveAngle) * movementFactor;

                    if (!checkCollision(nextX, activeCar.position.z, activeCar)) activeCar.position.x = nextX;
                    if (!checkCollision(activeCar.position.x, nextZ, activeCar)) activeCar.position.z = nextZ;

                    if (inputX !== 0 || inputZ !== 0) {
                        activeCar.rotation.y = moveAngle;
                    }
                }

                activeCar.position.x = Math.max(-70, Math.min(70, activeCar.position.x));
                activeCar.position.z = Math.max(-70, Math.min(70, activeCar.position.z));

                document.getElementById('action-btn').style.display = 'flex';
                document.getElementById('speedometer').innerText = `🚗 ${Math.round(currentCarSpeed)} km/h | Gear ${currentGear}`;
            }

            camera.position.x = activeObj.position.x + currentDist * Math.sin(cameraAngleX) * Math.cos(cameraAngleY);
            camera.position.y = activeObj.position.y + currentDist * Math.sin(cameraAngleY) + (isDriving ? 1.5 : 0.8);
            camera.position.z = activeObj.position.z + currentDist * Math.cos(cameraAngleX) * Math.cos(cameraAngleY);
            
            let lookTarget = activeObj.position.clone();
            lookTarget.y += (isDriving ? 0.8 : 0.7);
            camera.lookAt(lookTarget);

            if (activeObj.position.distanceTo(target.position) < 1.5) {
                score += 10;
                level += 1;
                
                document.getElementById('score-text').innerText = `Score: ${score}`;
                document.getElementById('level-title').innerText = `LEVEL ${level < 10 ? '0' + level : level}`;
                
                respawnTarget();
            }

            drawMiniMap();
        }

        function animate() {
            requestAnimationFrame(animate);
            updateGame();
            
            if(target) {
                target.rotation.z += 0.04;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        initGame();
    </script>
</body>
